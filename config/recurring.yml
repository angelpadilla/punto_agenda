#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  notify_events_today:
    class: EventsSetJob
    schedule: every 1 day at 8am
  clear_old_orders_carritos:
    command: "Order.carrito.where('created_at < ?', 2.day.ago).destroy_all"
    schedule: every 1 day at 3am

development:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  clear_old_orders_carritos:
    command: "Order.carrito.where('created_at < ?', 1.day.ago).destroy_all"
    schedule: every 30 minutes
  notify_events_today:
    class: EventsSetJob
    schedule: every 30 minutes
