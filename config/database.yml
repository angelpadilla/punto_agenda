# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
# default: &default
#   adapter: sqlite3
#   max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
#   timeout: 5000

# development:
#   <<: *default
#   database: storage/development.sqlite3

# # Warning: The database defined as "test" will be erased and
# # re-generated from your development database when you run "rake".
# # Do not set this db to the same as development or production.
# test:
#   <<: *default
#   database: storage/test.sqlite3

# Production uses PostgreSQL. Ensure the pg gem is defined in your Gemfile
postgres: &postgres
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("DB_POOL_SIZE") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  username: postgres
  password: <%= ENV["POSTGRES_PASSWORD"] %>

development:
  primary:
    <<: *postgres
    database: pos_agenda_development
  queue:
    <<: *postgres
    database: pos_agenda_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *postgres
    database: pos_agenda_cable
    migrations_paths: db/cable_migrate

test:
  <<: *postgres
  database: pos_agenda_test


# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary:
    <<: *postgres
    database: pos_agenda_production
  cache:
    <<: *postgres
    database: pos_agenda_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *postgres
    database: pos_agenda_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *postgres
    database: pos_agenda_cable
    migrations_paths: db/cable_migrate
